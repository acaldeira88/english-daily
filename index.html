<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Daily</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#1e293b}
h1{font-size:20px;margin:0}.stats span{margin-left:14px;font-weight:600}
main{max-width:720px;margin:auto;padding:20px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer;background:#334155;color:#fff;margin:4px}
.pri{background:#2563eb}.stop{background:#dc2626}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cat{background:#1e293b;border-radius:14px;padding:18px;cursor:pointer;font-size:17px}.cat:hover{background:#273449}
.cat small{display:block;color:#94a3b8;margin-top:6px}
.card{background:#1e293b;border-radius:18px;padding:28px;text-align:center;margin-bottom:16px}
.pt{font-size:26px;color:#facc15;margin-bottom:10px}.en{font-size:26px;font-weight:700;margin:14px 0;min-height:34px}
.hint{color:#94a3b8;font-size:14px;line-height:1.6}.big{font-size:18px;padding:16px 24px}
.st{font-size:20px;margin-top:14px;min-height:28px}.heard{font-style:italic;color:#cbd5e1;min-height:24px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#dc2626;margin-right:8px;animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
.bar{height:8px;background:#334155;border-radius:8px;margin:14px 0}.bar div{height:100%;background:#22c55e;border-radius:8px}
.warn{background:#7f1d1d;color:#fecaca;border-radius:12px;padding:14px;margin-bottom:16px;line-height:1.5}
</style></head><body>
<header><h1>🇺🇸 English Daily</h1><div class="stats"><span id="streak"></span><span id="xp"></span></div></header>
<main><div id="warn"></div><div id="app"></div></main>
<script>
const D={
'👋 Se apresentar':[["Hi, I'm Adriano. Nice to meet you.","Oi, eu sou o Adriano. Prazer."],["I work as a QA engineer.","Eu trabalho como engenheiro de QA."],["I live in São Paulo, Brazil.","Eu moro em São Paulo."],["I'm learning English every day.","Estou aprendendo inglês todo dia."],["What do you do?","O que você faz?"],["Where are you from?","De onde você é?"],["How long have you been here?","Há quanto tempo você está aqui?"]],
'❓ Perguntar':[["Can I ask you a question?","Posso te fazer uma pergunta?"],["What do you mean?","O que você quer dizer?"],["How does it work?","Como isso funciona?"],["When is the deadline?","Qual é o prazo?"],["Who is responsible for this?","Quem é o responsável por isso?"],["Could you send me the link?","Pode me mandar o link?"],["Is there any update?","Tem alguma atualização?"],["Why did it fail?","Por que falhou?"]],
'🙉 Não entendi':[["Sorry, could you repeat that?","Desculpa, pode repetir?"],["Could you speak more slowly, please?","Pode falar mais devagar, por favor?"],["I didn't get that.","Não entendi isso."],["How do you spell it?","Como se escreve?"],["Let me check and get back to you.","Deixa eu verificar e te retorno."]],
'💬 Opinião':[["I think that's a good idea.","Acho que é uma boa ideia."],["I agree with you.","Concordo com você."],["I see your point, but...","Entendo seu ponto, mas..."],["I'm not sure about that.","Não tenho certeza disso."],["What if we tried another approach?","E se tentássemos outra abordagem?"]],
'☕ Dia a dia':[["How was your weekend?","Como foi seu fim de semana?"],["I'm going to the gym later.","Vou pra academia mais tarde."],["I'm running a bit late.","Estou um pouco atrasado."],["It's been a long day.","Foi um dia longo."],["See you tomorrow.","Te vejo amanhã."]],
'💻 Trabalho e TI':[["Yesterday I worked on the login tests.","Ontem trabalhei nos testes de login."],["I'm blocked by this issue.","Estou bloqueado por esse problema."],["I found a bug in the payment page.","Achei um bug na página de pagamento."],["Can you reproduce the bug?","Você consegue reproduzir o bug?"],["The tests are passing now.","Os testes estão passando agora."],["I'll open a ticket in Jira.","Vou abrir um ticket no Jira."],["Could you review my pull request?","Pode revisar meu pull request?"]]};
const INT=[0,1,2,4,7,15],K='ed_v1';
let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}S.c=S.c||{};S.xp=S.xp||0;S.st=S.st||0;
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),wait=ms=>new Promise(r=>setTimeout(r,ms));
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}hdr()}
function hdr(){$('streak').textContent='🔥 '+S.st+' dias';$('xp').textContent='⭐ '+S.xp+' XP'}
function mark(){const t=today();if(S.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.st=S.last===y?S.st+1:1;S.last=t}
function due(){const t=today(),r=[];for(const c in D)D[c].forEach(p=>{const s=S.c[p[0]];if(s&&s.d<=t)r.push(p)});return r}
function fresh(n){const r=[];for(const c in D)D[c].forEach(p=>{if(!S.c[p[0]]&&r.length<n)r.push(p)});return r}
const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
function score(a,b){const A=norm(a).split(' '),B=new Set(norm(b).split(' '));let h=0;A.forEach(w=>{if(B.has(w))h++});return Math.round(100*h/A.length)}
function speak(t,rate){return new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.85;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,9000)})}

/* ===== Microfone contínuo: liga UMA vez na sessão ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('warn').innerHTML='<div class="warn">⚠️ Use o Google Chrome ou o Edge.</div>';
let rec=null,running=false,busy=true,onFinal=null,silenceT=null;
function micOn(){
 const r=new SR();rec=r;r.lang='en-US';r.continuous=true;r.interimResults=true;
 r.onresult=e=>{if(busy)return;for(let k=e.resultIndex;k<e.results.length;k++){const t=e.results[k][0].transcript;
   if(e.results[k].isFinal){if(onFinal){const f=onFinal;onFinal=null;f(t)}}else if($('heard'))$('heard').textContent=t}};
 r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){running=false;$('warn').innerHTML='<div class="warn">🔒 Microfone bloqueado. Clique no ícone ao lado do endereço, permita o microfone e recarregue (F5).</div>'}
   if(e.error==='audio-capture'){running=false;$('warn').innerHTML='<div class="warn">🎙️ Nenhum microfone encontrado. Confira o microfone no Windows.</div>'}};
 r.onend=()=>{if(running)setTimeout(()=>{try{r.start()}catch(e){}},200)};
 try{r.start()}catch(e){}}
function micOff(){running=false;if(rec){try{rec.abort()}catch(e){}rec=null}}
// Espera você falar uma frase (até 10s)
function hear(){return new Promise(res=>{if($('heard'))$('heard').textContent='';busy=false;
 clearTimeout(silenceT);silenceT=setTimeout(()=>{if(onFinal){onFinal=null;busy=true;res('')}},10000);
 onFinal=t=>{clearTimeout(silenceT);busy=true;res(t)}})}
async function say(t,rate){busy=true;await speak(t,rate);await wait(250)}

/* ===== Sessão ===== */
let Q=[],i=0,ok=0;
function status(h){if($('st'))$('st').innerHTML=h}
function screen(p){$('app').innerHTML='<div class="bar"><div style="width:'+(100*i/Q.length)+'%"></div></div><div class="card"><div class="hint">Diga em inglês:</div><div class="pt">'+p[1]+'</div><div class="en" id="en"></div><div class="heard" id="heard"></div><div class="st" id="st"></div></div><p style="text-align:center"><button class="btn stop big" onclick="stop()">⏹️ Parar</button></p><p class="hint" style="text-align:center">Quando aparecer 🔴, fale e faça uma pausa. Ele entende sozinho que você terminou.<br>Comandos de voz: <b>"skip"</b> pula a frase, <b>"stop"</b> encerra.</p>'}
function start(c){if(!SR)return;Q=c?D[c].slice().sort(()=>Math.random()-.5):due().slice(0,7).concat(fresh(5));if(!Q.length)Q=fresh(8);if(!Q.length)Q=D[Object.keys(D)[0]].slice().sort(()=>Math.random()-.5);
 i=0;ok=0;running=true;busy=true;micOn();loop()}
function stop(){micOff();speechSynthesis.cancel();clearTimeout(silenceT);onFinal=null;home()}
async function loop(){
 while(running&&i<Q.length){const p=Q[i];screen(p);let got=false;
  for(let tent=1;tent<=3&&running;tent++){
   status('<span class="dot"></span>Ouvindo... pode falar');
   const t=await hear();if(!running)return;const n=norm(t);
   if(n==='stop'||n==='parar')return stop();
   if(n==='skip'||n==='next'||n==='pular')break;
   if(!n){status('🤫 Não ouvi. Escute e repita:');$('en').textContent=p[0];await say(p[0]);continue}
   const s=score(p[0],t);$('heard').textContent='Você disse: "'+t+'"';
   if(s>=70){got=tent===1;status('✅ Mandou bem! '+s+'%');$('en').textContent=p[0];await say(tent===1?'Great!':'Good!');await wait(600);break}
   status(tent<3?'🟡 Quase ('+s+'%). Escute e repita:':'👂 Escute com calma e vamos pra próxima.');$('en').textContent=p[0];
   await say(p[0],tent===1?.85:.65)}
  if(!running)return;grade(p,got);i++;await wait(300)}
 if(running){micOff();done()}}
function grade(p,g){const s=S.c[p[0]]||{b:0};s.b=g?Math.min(s.b+1,5):0;s.d=new Date(Date.now()+INT[s.b]*864e5).toISOString().slice(0,10);S.c[p[0]]=s;
 if(g){ok++;S.xp+=10}else{S.xp+=3;if(Q.filter(x=>x===p).length<2)Q.push(p)}mark();save()}
function home(){let h='<div class="card"><div class="pt">Modo mãos livres 🙌</div><p class="hint">Clique uma vez e só fale. Aparece a frase em português, você diz em inglês, ele corrige, fala a resposta e passa sozinho.<br>Na primeira vez, clique em <b>"Permitir ao acessar o site"</b>.</p><button class="btn pri big" onclick="start()">▶️ Começar ('+due().length+' para revisar)</button></div><h3>Ou escolha uma situação:</h3><div class="grid">';
 for(const c in D){const k=D[c].filter(p=>S.c[p[0]]&&S.c[p[0]].b>=3).length;h+='<div class="cat" onclick="start(\''+c+'\')">'+c+'<small>'+k+'/'+D[c].length+' dominadas</small></div>'}
 $('app').innerHTML=h+'</div>'}
function done(){$('app').innerHTML='<div class="card"><div class="en">🎉 Sessão concluída!</div><p class="pt">'+ok+' de primeira · 🔥 '+S.st+' dias seguidos</p><p class="hint">O que você errou volta amanhã. O que acertou volta mais tarde.</p><button class="btn pri big" onclick="home()">🏠 Voltar</button></div>'}
hdr();home();
</script></body></html>
